@keyframes ap-tt{0%,19%{opacity:.25}23%,95%{opacity:1}100%{opacity:.25}}
@media (prefers-reduced-motion:reduce){.ap-c1,.ap-c2,.ap-c3,.ap-k1,.ap-k2,.ap-k3,.ap-tt{animation:none}}
</style>
