<style>
.sy-gl{stroke:#5AB0FF;stroke-width:30;opacity:.15}
.sy-hl,.sy-cd,.sy-ln,.sy-dt{animation:12s ease-in-out infinite}
.sy-hl{animation-name:sy-hl}.sy-cd{animation-name:sy-cd}
.sy-ln{stroke-dasharray:100 100;animation-name:sy-ln}
.sy-dt{stroke-dasharray:.1 200;stroke-dashoffset:-100;opacity:0;animation-name:sy-dt}
@keyframes sy-hl{0%{opacity:.3}4%,95%{opacity:1}100%{opacity:.3}}
@keyframes sy-ln{0%,4%{stroke-dashoffset:100;opacity:1}12%,95%{stroke-dashoffset:0;opacity:1}99.9%{stroke-dashoffset:0;opacity:0}100%{stroke-dashoffset:100;opacity:0}}
@keyframes sy-dt{0%,4%{stroke-dashoffset:0;opacity:0}5%{opacity:1}12%{stroke-dashoffset:-100;opacity:1}15%,100%{stroke-dashoffset:-100;opacity:0}}
@keyframes sy-cd{0%,11%{opacity:.25}15%,95%{opacity:1}100%{opacity:.25}}
@media (prefers-reduced-motion:reduce){.sy-hl,.sy-cd,.sy-ln,.sy-dt{animation:none}}
</style>
<rect width="600" height="749" rx="12" fill="#0A0A0D"/>
<rect width="600" height="749" rx="12" fill="url(#sy-g)"/>
<rect width="600" height="749" rx="12" fill="url(#sy-r)"/>
