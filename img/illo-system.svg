<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 749" fill="none" stroke-linecap="round" stroke-linejoin="round">
<defs>
<pattern id="sy-g" width="48" height="48" patternUnits="userSpaceOnUse"><path d="M48 0H0V48" stroke="#5AB0FF" stroke-opacity=".06" stroke-width="1.5"/></pattern>
<radialGradient id="sy-r" cx=".62" cy=".62" r=".55"><stop offset="0" stop-color="#5AB0FF" stop-opacity=".18"/><stop offset="1" stop-color="#5AB0FF" stop-opacity="0"/></radialGradient>
<rect id="sy-m" x="30" y="30" width="540" height="362" rx="22"/>
