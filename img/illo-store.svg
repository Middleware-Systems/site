<path transform="translate(161 362)" d="M-62-18L0-46L62-18L0 10ZM-62-18V38L0 66L62 38V-18M0 10V66M-31-32L31-4"/>
</g>
<!-- the one tapped: photographed, framed, ordered -->
<use href="#st-cd" x="312" y="276" class="st-gl"/>
<use href="#st-cd" x="312" y="276" stroke="#9AD4FF" stroke-width="6"/>
<rect x="324" y="288" width="230" height="152" rx="10" fill="url(#st-l)"/>
<path d="M338 324V302H360M518 302H540V324M540 404V426H518M360 426H338V404" stroke="#FFFFFF" stroke-width="6"/>
<g class="st-pr"><use href="#st-tin" x="433" y="362" stroke="#FFFFFF" stroke-width="6" fill="none"/></g>
<rect x="330" y="464" width="110" height="16" rx="8" fill="#9AD4FF"/>
<circle class="st-rp" cx="526" cy="488" r="44" stroke="#FFFFFF" stroke-width="5"/>
<g class="st-tk"><circle cx="526" cy="488" r="26" fill="#FFFFFF"/><path d="M514 488l8 8 15-16" stroke="#0A0A0D" stroke-width="6"/></g>
<!-- the cart: the order, held -->
<g class="st-dp">
<g class="st-b"><use href="#st-tin" transform="translate(300 628) scale(.55)" stroke="#FFFFFF" stroke-width="10" fill="#15151B"/></g>
<path d="M185 606H450L412 690H212Z" fill="#0A0A0D" opacity=".4"/>
<path d="M262 606V690M312 606V690M362 606V690M199 648H431" stroke="#5AB0FF" stroke-width="4" opacity=".55"/>
<g stroke-width="9"><use href="#st-ct" class="st-gl"/><use href="#st-ct" stroke="#5AB0FF"/><use href="#st-ct" stroke="#9AD4FF" stroke-width="2.5"/>
<circle cx="232" cy="720" r="14" stroke="#5AB0FF" stroke-width="8"/><circle cx="392" cy="720" r="14" stroke="#5AB0FF" stroke-width="8"/></g>
</g>
<!-- in flight: above everything -->
<g class="st-a"><use href="#st-tin" stroke="#FFFFFF" stroke-width="10" fill="#15151B"/></g>
</svg>
